name: Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'go.*'
      - '**.go'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/**'
      - 'go.*'
      - '**.go'

jobs:
  strongo_workflow:
    permissions:
      contents: write
    uses: strongo/cicd/.github/workflows/workflow.yml@main
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    with:
      min_test_coverage_percent: 100
